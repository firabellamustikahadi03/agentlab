name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A command or snippet. Prefer the offline mock provider so others can run it.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: AgentLab version / commit
      placeholder: "0.2.0 or a commit hash"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
  - type: textarea
    id: trace
    attributes:
      label: Trace or traceback
      description: "`agentlab traces show <run_id>` output helps. Remove API keys and private data first."
      render: text
