[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.1.0"
description = "From-scratch multi-agent runtime with tracing, replay and automatic evaluation"
requires-python = ">=3.10"
dependencies = []  # stdlib only on purpose

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
