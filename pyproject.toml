[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab"
version = "0.1.0"
description = "From-scratch multi-agent runtime with tracing, replay and automatic evaluation"
requires-python = ">=3.10"
dependencies = []  # stdlib only on purpose

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore::ResourceWarning",  # in-memory test stores are never closed explicitly
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.coverage.run]
source = ["agentlab"]

[tool.coverage.report]
fail_under = 85
show_missing = true
